<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Plant Health AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="container">

        <header>

            <div class="logo">
                🌱
            </div>

            <h1>PLANT HEALTH AI</h1>

            <p>
                Deep Learning Based Plant Health Prediction
            </p>

        </header>


        <main>

            <section class="card">

                <h2>Enter Plant Conditions</h2>

                <p class="subtitle">
                    Enter the environmental values below
                    to predict plant health.
                </p>


                <div class="form-grid">

                    <div class="input-box">

                        <label>Soil Moisture (%)</label>

                        <input
                            type="number"
                            id="soil_moisture"
                            placeholder="Example: 65"
                            min="0"
                            max="100"
                            step="0.1"
                        >

                    </div>


                    <div class="input-box">

                        <label>Temperature (°C)</label>

                        <input
                            type="number"
                            id="temperature"
                            placeholder="Example: 28"
                            step="0.1"
                        >

                    </div>


                    <div class="input-box">

                        <label>Humidity (%)</label>

                        <input
                            type="number"
                            id="humidity"
                            placeholder="Example: 70"
                            min="0"
                            max="100"
                            step="0.1"
                        >

                    </div>


                    <div class="input-box">

                        <label>Leaf Moisture (%)</label>

                        <input
                            type="number"
                            id="leaf_moisture"
                            placeholder="Example: 60"
                            min="0"
                            max="100"
                            step="0.1"
                        >

                    </div>


                    <div class="input-box">

                        <label>Sunlight (%)</label>

                        <input
                            type="number"
                            id="sunlight"
                            placeholder="Example: 75"
                            min="0"
                            max="100"
                            step="0.1"
                        >

                    </div>


                    <div class="input-box">

                        <label>Soil pH</label>

                        <input
                            type="number"
                            id="soil_ph"
                            placeholder="Example: 6.5"
                            min="0"
                            max="14"
                            step="0.1"
                        >

                    </div>

                </div>


                <button
                    onclick="predictHealth()"
                    class="predict-btn"
                >
                    PREDICT HEALTH
                </button>


                <div
                    id="loading"
                    class="loading"
                    style="display:none;"
                >
                    Analyzing plant conditions...
                </div>


                <div
                    id="result"
                    class="result"
                    style="display:none;"
                >

                    <h2 id="resultTitle">
                        HEALTHY
                    </h2>

                    <div class="confidence">

                        Confidence:
                        <span id="confidence">
                            0
                        </span>%

                    </div>

                    <p id="message"></p>

                </div>

            </section>

        </main>


        <footer>

            <p>
                Plant Health AI | Deep Learning Mini Project
            </p>

        </footer>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>

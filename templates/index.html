<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plant Health AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<div class="page">


    <header class="header">

        <div class="leaf">
            🌱
        </div>

        <h1>
            PLANT HEALTH AI
        </h1>

        <p>
            Deep Learning Based Plant Health Prediction
        </p>

    </header>


    <div class="card">

        <h2>
            Plant Condition Analysis
        </h2>

        <p class="description">
            Enter the plant environment values to predict plant health.
        </p>


        <div class="grid">


            <div class="input-group">

                <label>
                    Soil Moisture (%)
                </label>

                <input
                    type="number"
                    id="soil_moisture"
                    placeholder="65"
                    min="0"
                    max="100"
                    step="0.1"
                >

            </div>


            <div class="input-group">

                <label>
                    Temperature (°C)
                </label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="28"
                    step="0.1"
                >

            </div>


            <div class="input-group">

                <label>
                    Humidity (%)
                </label>

                <input
                    type="number"
                    id="humidity"
                    placeholder="70"
                    min="0"
                    max="100"
                    step="0.1"
                >

            </div>


            <div class="input-group">

                <label>
                    Leaf Moisture (%)
                </label>

                <input
                    type="number"
                    id="leaf_moisture"
                    placeholder="60"
                    min="0"
                    max="100"
                    step="0.1"
                >

            </div>


            <div class="input-group">

                <label>
                    Sunlight (%)
                </label>

                <input
                    type="number"
                    id="sunlight"
                    placeholder="75"
                    min="0"
                    max="100"
                    step="0.1"
                >

            </div>


            <div class="input-group">

                <label>
                    Soil pH
                </label>

                <input
                    type="number"
                    id="soil_ph"
                    placeholder="6.5"
                    min="0"
                    max="14"
                    step="0.1"
                >

            </div>

        </div>


        <button
            onclick="predictHealth()"
            class="predict-button"
        >
            PREDICT HEALTH
        </button>


        <div
            id="loading"
            class="loading hidden"
        >
            Analyzing plant conditions...
        </div>


        <div
            id="result"
            class="result hidden"
        >

            <div class="result-icon">
                🌿
            </div>

            <h2 id="result-title">
                HEALTHY
            </h2>

            <p class="confidence-text">

                Confidence:

                <strong id="confidence">
                    0
                </strong>%

            </p>

            <p id="message">
                Plant analysis result.
            </p>

        </div>

    </div>


    <footer>

        Plant Health AI

        <span>•</span>

        Deep Learning Mini Project

    </footer>


</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
